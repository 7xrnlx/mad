<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madb | Ultra Hub</title>

    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/epoxy/index.js"></script>
    <script src="/register-sw.js"></script>

    <style>
        :root {
            --bg: #f8fafc; --container: #ffffff; --text: #0f172a; --accent: #3b82f6;
            --nav-bg: #f1f5f9; --border: #e2e8f0; --card-bg: #ffffff;
            --win: #22c55e; --loss: #ef4444;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --bg: #0f172a; --container: #1e293b; --text: #f8fafc; --accent: #3b82f6;
            --nav-bg: #334155; --border: #475569; --card-bg: #1e293b;
        }

        [data-theme="cyberpunk"] {
            --bg: #020617; --container: #0f172a; --text: #22d3ee; --accent: #f43f5e;
            --nav-bg: #1e293b; --border: #f43f5e; --card-bg: #1e293b;
        }

        [data-theme="sakura"] {
            --bg: #fff1f2; --container: #ffffff; --text: #9f1239; --accent: #fb7185;
            --nav-bg: #ffe4e6; --border: #fda4af; --card-bg: #fffafb;
        }

        [data-theme="ocean"] {
            --bg: #082f49; --container: #0c4a6e; --text: #e0f2fe; --accent: #0ea5e9;
            --nav-bg: #075985; --border: #38bdf8; --card-bg: #0c4a6e;
        }

        * { 
            transition: background 0.6s ease, color 0.6s ease, border 0.6s ease; 
            box-sizing: border-box; 
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body { background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }

        .main-ui-container {
            width: 95%; max-width: 1050px;
            margin: 35px auto; padding: 35px;
            background: var(--container); border-radius: 32px;
            box-shadow: 0 20px 60px -15px rgba(0,0,0,0.1); border: 1px solid var(--border);
            position: relative;
        }

        /* Navigation & Buttons */
        .nav-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .links-group { display: flex; gap: 20px; } 
        .links-group a { text-decoration: none; color: var(--text); font-weight: 700; opacity: 0.7; font-size: 1.3rem; }
        .links-group a:hover { opacity: 1; color: var(--accent); }

        .browser-box { display: flex; background: var(--nav-bg); border-radius: 18px; padding: 6px; border: 2px solid transparent; margin-top: 35px; }
        .browser-box:focus-within { border-color: var(--accent); background: var(--container); }
        .browser-box input { flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--text); font-size: 1.05rem; outline: none; }
        .browser-btn { background: var(--accent); color: white; border: none; border-radius: 14px; padding: 0 22px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }

        /* Proxy Overlay */
        #proxy-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: none; flex-direction: column;
        }
        .proxy-nav {
            height: 60px; background: var(--container); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 15px;
        }
        .proxy-nav input { flex: 1; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--nav-bg); color: var(--text); }
        .exit-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #sj-frame { border: none; width: 100%; height: calc(100% - 60px); background: white; }

        /* Rest of UI Styles */
        .theme-pill-box { display: flex; position: relative; background: var(--nav-bg); padding: 4px; border-radius: 50px; border: 1px solid var(--border); }
        .theme-pill-box button { width: 40px; height: 36px; border: none; background: transparent; cursor: pointer; z-index: 2; font-size: 1.05rem; }
        .theme-indicator { position: absolute; height: 36px; width: 40px; background: var(--accent); border-radius: 50px; top: 4px; left: 4px; transition: transform 0.4s var(--ease); z-index: 1; }
        .main-tab-bar { display: flex; gap: 18px; margin-bottom: 22px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .main-tab-btn { background: transparent; border: none; color: var(--text); font-size: 1.15rem; font-weight: 800; opacity: 0.4; cursor: pointer; }
        .main-tab-btn.active { opacity: 1; color: var(--accent); border-bottom: 3px solid var(--accent); }
        .sub-tab-bar { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
        .sport-btn { padding: 9px 16px; border: none; background: var(--nav-bg); color: var(--text); border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
        .sport-btn.active { background: var(--accent); color: white; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 22px; border: 1px solid var(--border); text-decoration: none; color: var(--text); display: flex; flex-direction: column; justify-content: space-between; min-height: 170px; }
        .score-row { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.2rem; margin: 5px 0; }
        .win-text { color: var(--win) !important; font-weight: 900; }
        .loss-text { color: var(--loss) !important; opacity: 0.7; }
        footer { text-align: center; padding: 35px 0; opacity: 0.5; font-size: 0.8rem; font-weight: 600; }
        
        @keyframes reveal { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-reveal { animation: reveal 0.8s var(--ease) forwards; opacity: 0; }
    </style>
</head>
<body data-theme="default">

    <div id="proxy-overlay">
        <div class="proxy-nav">
            <button class="exit-btn" onclick="exitProxy()">EXIT</button>
            <form id="proxy-nav-form" style="flex:1; display:flex;">
                <input id="proxy-nav-input" type="text" placeholder="Enter URL or search...">
            </form>
        </div>
        </div>

    <div class="main-ui-container">
        <div class="nav-links">
            <div class="links-group">
                <a href="/">Home</a><a href="/games">Games</a><a href="/proxies">Proxies</a>
            </div>
            <div class="theme-pill-box">
                <div class="theme-indicator" id="indicator"></div>
                <button onclick="setTheme('default', 0)">☀</button>
                <button onclick="setTheme('dark', 1)">🌙</button>
                <button onclick="setTheme('cyberpunk', 2)">⚡</button>
                <button onclick="setTheme('sakura', 3)">🌸</button>
                <button onclick="setTheme('ocean', 4)">🌊</button>
            </div>
        </div>

        <h1 style="text-align:center; font-size: 4rem; margin:0; letter-spacing:-4px;">madb</h1>
        <p style="text-align:center; opacity:0.5; font-weight: 800; font-size: 0.95rem;">WATCH SPORTS & BROWSE ANYTHING</p>

        <form class="browser-box" id="sj-form">
            <input type="hidden" id="sj-search-engine" value="https://www.google.com/search?q=%s">
            <input type="text" id="sj-address" placeholder="Search Google or type URL..." autocomplete="off">
            <button type="submit" class="browser-btn" id="sj-btn">GO</button>
        </form>
    </div>

    <div class="main-ui-container">
        <div style="margin-bottom:18px;">
            <h2 style="margin:0; font-weight:900; font-size: 2rem;">Sports Hub</h2>
        </div>

        <div class="main-tab-bar">
            <button class="main-tab-btn active" id="news-tab-btn" onclick="switchMainMode('NEWS')">Sports News</button>
            <button class="main-tab-btn" id="scores-tab-btn" onclick="switchMainMode('SCORES')">Sports Scores</button>
        </div>

        <div class="sub-tab-bar" id="sub-tabs"></div>
        <div id="content-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px;"></div>
    </div>

    <footer>&copy; 2026 madb &bull; Built for Privacy</footer>

    <script>
        "use strict";

        // --- BROWSER / PROXY LOGIC ---
        function search(input, template) {
            try { return new URL(input).toString(); } catch (err) { }
            try {
                const url = new URL(`http://${input}`);
                if (url.hostname.includes(".")) return url.toString();
            } catch (err) { }
            return template.replace("%s", encodeURIComponent(input));
        }

        async function manualRegisterSW() {
            if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.register('/scram/sw.js', { scope: '/scram/service/' });
            }
            throw new Error("Service Workers not supported.");
        }

        window.addEventListener('load', async () => {
            const form = document.getElementById("sj-form");
            const address = document.getElementById("sj-address");
            const searchEngine = document.getElementById("sj-search-engine");
            const proxyOverlay = document.getElementById("proxy-overlay");
            const proxyInput = document.getElementById("proxy-nav-input");
            const proxyNavForm = document.getElementById("proxy-nav-form");

            if (typeof BareMux === 'undefined' || typeof $scramjetLoadController === 'undefined') {
                console.error("Proxy libraries failed to load.");
                return;
            }

            const { ScramjetController } = $scramjetLoadController();
            const scramjet = new ScramjetController({
                files: { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' },
            });
            scramjet.init();

            const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const val = address.value.trim();
                if (!val) return;

                try {
                    if (typeof registerSW === 'function') await registerSW();
                    else await manualRegisterSW();

                    const url = search(val, searchEngine.value);
                    const wispUrl = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
                    
                    if ((await connection.getTransport()) !== "/epoxy/index.mjs") {
                        await connection.setTransport("/epoxy/index.mjs", [{ wisp: wispUrl }]);
                    }

                    document.body.style.overflow = "hidden";
                    proxyOverlay.style.display = "flex";
                    proxyInput.value = url;

                    const existingFrame = document.getElementById("sj-frame");
                    if (existingFrame) existingFrame.remove();

                    const frame = scramjet.createFrame();
                    frame.frame.id = "sj-frame";
                    proxyOverlay.appendChild(frame.frame);
                    frame.go(url);
                } catch (err) {
                    alert("Proxy Error: " + err.message);
                }
            });

            proxyNavForm.addEventListener('submit', (e) => {
                e.preventDefault();
                address.value = proxyInput.value;
                form.dispatchEvent(new Event('submit'));
            });

            window.exitProxy = function() {
                document.body.style.overflow = "auto";
                proxyOverlay.style.display = "none";
                const f = document.getElementById("sj-frame");
                if (f) f.remove();
                address.value = "";
            }
        });

        // --- UI & SPORTS HUB LOGIC ---
        let currentMode = 'NEWS';
        let currentLeague = 'MLB';
        const leagues = ['MLB', 'NFL', 'NHL', 'NBA', 'FC'];

        function setTheme(theme, index) {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('indicator').style.transform = `translateX(${index * 40}px)`;
            localStorage.setItem('madb-theme', JSON.stringify({theme, index}));
        }

        function switchMainMode(mode) {
            currentMode = mode;
            document.getElementById('news-tab-btn').classList.toggle('active', mode === 'NEWS');
            document.getElementById('scores-tab-btn').classList.toggle('active', mode === 'SCORES');
            renderSubTabs();
        }

        function renderSubTabs() {
            const container = document.getElementById('sub-tabs');
            container.innerHTML = "";
            leagues.forEach(l => {
                const btn = document.createElement('button');
                btn.className = `sport-btn ${l === currentLeague ? 'active' : ''}`;
                btn.innerText = l;
                btn.onclick = () => { currentLeague = l; renderSubTabs(); };
                container.appendChild(btn);
            });
            if(currentMode === 'NEWS') loadNews(currentLeague); else loadScores(currentLeague);
        }

        async function loadNews(league) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = "";
            const feed = league === 'FC' ? 'soccer' : league.toLowerCase();
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.espn.com/espn/rss/${feed}/news`);
                const data = await res.json();
                data.items.slice(0, 9).forEach((item, i) => {
                    const card = document.createElement('a');
                    card.className = "card animate-reveal";
                    card.style.animationDelay = `${i * 0.05}s`;
                    card.href = item.link; card.target = "_blank";
                    card.innerHTML = `
                        <div>
                            <div style="font-size:0.7rem; font-weight:900; color:var(--accent); text-transform:uppercase; margin-bottom:10px;">${league}</div>
                            <h3 style="margin:0; font-size:1.1rem; line-height:1.4;">${item.title}</h3>
                        </div>
                        <p style="font-size:0.75rem; opacity:0.5; margin-top:20px; font-weight:bold;">${new Date(item.pubDate).toLocaleDateString()}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) { grid.innerHTML = "Sync Error."; }
        }

        async function loadScores(league) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = "";
            const sportMap = { 'MLB': 'baseball/mlb', 'NFL': 'football/nfl', 'NBA': 'basketball/nba', 'NHL': 'hockey/nhl', 'FC': 'soccer/eng.1' };
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportMap[league]}/scoreboard`);
                const data = await res.json();
                data.events.forEach((game, i) => {
                    const comp = game.competitions[0];
                    const home = comp.competitors[0];
                    const away = comp.competitors[1];
                    const isFinal = game.status.type.state === 'post';
                    
                    let hStyle = "", aStyle = "";
                    if (isFinal) {
                        if (parseInt(home.score) > parseInt(away.score)) { hStyle = "win-text"; aStyle = "loss-text"; }
                        else if (parseInt(away.score) > parseInt(home.score)) { aStyle = "win-text"; hStyle = "loss-text"; }
                    }

                    const card = document.createElement('div');
                    card.className = "card animate-reveal";
                    card.style.animationDelay = `${i * 0.05}s`;
                    card.innerHTML = `
                        <div style="font-size:0.65rem; font-weight:900; color:var(--accent); margin-bottom:12px;">
                            <span style="background:var(--nav-bg); padding:4px 8px; border-radius:6px;">${game.status.type.shortDetail}</span>
                        </div>
                        <div class="score-row"><span class="${aStyle}">${away.team.abbreviation}</span><span>${away.score}</span></div>
                        <div class="score-row"><span class="${hStyle}">${home.team.abbreviation}</span><span>${home.score}</span></div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) { grid.innerHTML = "No games found."; }
        }

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('madb-theme'));
            if(saved) setTheme(saved.theme, saved.index);
            renderSubTabs();
        };
    </script>
</body>
</html>
